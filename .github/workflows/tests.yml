name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lets the tests check the shipped stylesheet against its sources.
      - run: npm ci

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpunit
